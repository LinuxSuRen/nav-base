name: Build Multi-Arch Base Image

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Docker meta (full)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=${{ matrix.suffix }}-
            type=raw,value=${{ matrix.suffix }},enable={{is_default_branch}}

      - name: Docker meta (slim)
        id: meta_slim
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=${{ matrix.suffix }}-slim-
            type=raw,value=${{ matrix.suffix }}-slim,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # full：显式 --target build（slim 追加为最后阶段后，防止默认目标漂移）
      - name: Build and push full (${{ matrix.suffix }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: build
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}
          build-args: |
            BUILD_JOBS=4

      # slim：仅运行期内容（与 full 同一 Dockerfile，共享层缓存）
      - name: Build and push slim (${{ matrix.suffix }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: slim
          push: true
          tags: ${{ steps.meta_slim.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}
          build-args: |
            BUILD_JOBS=4

  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create multi-arch manifest
        run: |
          SHA_SHORT=${GITHUB_SHA::7}
          IMAGE_LC=$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          
          # buildx 推的单架构镜像也是 manifest list 格式——
          # docker manifest create 不接受 manifest list 作为源，
          # 必须用 docker buildx imagetools create（原生支持合并）
          
          # 短 SHA tag
          docker buildx imagetools create \
            -t "${IMAGE_LC}:${SHA_SHORT}" \
            "${IMAGE_LC}:amd64-${SHA_SHORT}" \
            "${IMAGE_LC}:arm64-${SHA_SHORT}"
          
          # latest tag
          docker buildx imagetools create \
            -t "${IMAGE_LC}:latest" \
            "${IMAGE_LC}:amd64" \
            "${IMAGE_LC}:arm64"
          
          # slim 变体（tag 后缀 -slim，仅运行期内容）
          docker buildx imagetools create \
            -t "${IMAGE_LC}:${SHA_SHORT}-slim" \
            "${IMAGE_LC}:amd64-slim-${SHA_SHORT}" \
            "${IMAGE_LC}:arm64-slim-${SHA_SHORT}"
          
          docker buildx imagetools create \
            -t "${IMAGE_LC}:latest-slim" \
            "${IMAGE_LC}:amd64-slim" \
            "${IMAGE_LC}:arm64-slim"
          
          echo "Multi-arch: ${IMAGE_LC}:${SHA_SHORT}"
          echo "Multi-arch: ${IMAGE_LC}:latest"
          echo "Multi-arch: ${IMAGE_LC}:${SHA_SHORT}-slim"
          echo "Multi-arch: ${IMAGE_LC}:latest-slim"
