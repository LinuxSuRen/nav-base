name: Build Multi-Arch Base Image

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=${{ matrix.suffix }}-
            type=raw,value=${{ matrix.suffix }},enable={{is_default_branch}}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push (${{ matrix.suffix }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}
          build-args: |
            BUILD_JOBS=4

  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create and push multi-arch manifest
        run: |
          SHA_SHORT=${GITHUB_SHA::7}
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          IMAGE_LC=$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]')
          
          # metadata-action 的 type=sha,prefix=<suffix>- 生成 <suffix>-<sha> 格式
          # 如 prefix=amd64- + sha=abc1234 → tag 为 amd64-abc1234
          
          # 短 SHA tag（多架构）
          docker manifest create "${IMAGE_LC}:${SHA_SHORT}" \
            "${IMAGE_LC}:amd64-${SHA_SHORT}" \
            "${IMAGE_LC}:arm64-${SHA_SHORT}"
          docker manifest push "${IMAGE_LC}:${SHA_SHORT}"
          
          # latest tag（多架构）
          docker manifest create "${IMAGE_LC}:latest" \
            "${IMAGE_LC}:amd64" \
            "${IMAGE_LC}:arm64"
          docker manifest push "${IMAGE_LC}:latest"
          
          echo "Multi-arch image: ${IMAGE_LC}:${SHA_SHORT}"
          echo "Multi-arch latest: ${IMAGE_LC}:latest"
          echo ""
          echo "Usage in downstream Dockerfile:"
          echo "  ARG ROS_IMAGE=ghcr.io/${IMAGE_NAME}:latest"
          echo "  ARG ROS_IMAGE=ghcr.io/${IMAGE_NAME}:${SHA_SHORT}"
